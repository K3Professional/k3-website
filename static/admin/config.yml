# Blog editor settings (Decap CMS). Open the editor at /admin.
#
# Kept to four fields on purpose: Title, Category, Cover image, Post. The site
# fills in everything else when it builds (src/build.py → read_post):
#   - date: from the file name, which the editor starts with the day it was created
#   - search description and blog-card summary: the post's first paragraph
#   - image description: the title
#   - featured: the newest post leads the blog page
backend:
  name: github
  repo: K3Professional/k3-website
  branch: main
  commit_messages:
    create: "Blog: add “{{slug}}”"
    update: "Blog: update “{{slug}}”"
    delete: "Blog: delete “{{slug}}”"
    uploadMedia: "Blog: upload image {{path}}"
    deleteMedia: "Blog: delete image {{path}}"

site_url: https://k3professionalservices.com
display_url: https://k3professionalservices.com
logo:
  src: /images/k3-logo-256.webp
  show_in_header: true

media_folder: static/images/blog
public_folder: /images/blog

collections:
  - name: blog
    label: Blog Posts
    label_singular: Blog Post
    description: "Click “+ Blog Post”, fill in the four boxes, then click Publish → Publish now. It's live on the K3 blog in about a minute."
    folder: content/blog
    create: true
    extension: md
    format: json-frontmatter
    # File name = publish date + title. The site reads the date from it and
    # uses only the title part in the web address: /blog/your-title
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}}"
    sortable_fields: ["commit_date", "title"]
    editor:
      preview: false
    fields:
      - label: Title
        name: title
        widget: string
        hint: "Your headline. It also becomes the web address."
      - label: Category
        name: category
        widget: select
        default: "Career Development"
        options: ["Career Development", "Resume Tips", "Interview Prep", "Job Search", "Industry Insights"]
      - label: Cover image
        name: image
        widget: image
        required: false
        choose_url: false
        hint: "Optional. A wide (landscape) photo looks best. If you skip it, the blog banner image is used."
      - label: Post
        name: body
        widget: markdown
        modes: ["rich_text"]
        buttons: ["bold", "italic", "link", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list"]
        editor_components: ["image"]
        hint: "Your first paragraph becomes the summary people see in Google and on the blog page, so make it a good one."
